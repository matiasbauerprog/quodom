# Deploy de los dos servicios en Render (Blueprint).
# En Render: New > Blueprint > este repo. Pide dos valores al crear:
#   APP_URL      -> la URL pública del frontend (quodom-app)
#   VITE_API_URL -> la URL pública del API (quodom-api)
# Como cada una necesita la otra, se crean primero y se completan después:
# poner cualquier cosa, y al terminar editar cada servicio con la URL real y
# volver a desplegar. El frontend se rebuildea, el API sólo reinicia.
services:
  - type: web
    name: quodom-api
    runtime: node
    plan: free
    rootDir: quodom-web/api
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /categorias
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Sin servidor de correo, las cuentas nuevas quedan validadas solas
      # (users.controller.js). En true y sin SMTP nadie puede iniciar sesión.
      - key: EMAIL_ENABLED
        value: "false"
      - key: APP_URL
        sync: false

  - type: web
    name: quodom-app
    runtime: static
    # Sin `plan`: los static sites de Render no aceptan ese campo, son gratis
    # por definición y declararlo hace fallar el blueprint entero.
    rootDir: quodom-web/app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # La app es una SPA: sin esto, entrar directo a cualquier URL que no sea
      # la raíz devuelve 404 en vez de la aplicación.
      - type: rewrite
        source: /*
        destination: /index.html
