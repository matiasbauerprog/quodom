# Deploy de los dos servicios en Render (Blueprint).
# En Render: New > Blueprint > este repo. Pide dos valores al crear:
#   APP_URL      -> la URL pública del frontend (quodom-app)
#   VITE_API_URL -> /api (la app le habla al API por su propio dominio; ver
#                   la regla /api/* más abajo)
# Como cada una necesita la otra, se crean primero y se completan después:
# poner cualquier cosa, y al terminar editar cada servicio con la URL real y
# volver a desplegar. El frontend se rebuildea, el API sólo reinicia.
services:
  - type: web
    name: quodom-api
    runtime: node
    plan: free
    rootDir: quodom-web/api
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /categorias
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Sin servidor de correo, las cuentas nuevas quedan validadas solas
      # (users.controller.js). En true y sin SMTP nadie puede iniciar sesión.
      - key: EMAIL_ENABLED
        value: "false"
      - key: APP_URL
        sync: false
      # Sin esto el asistente no funciona: el server contesta "El asistente no
      # está disponible por ahora", que se lee como una falla del producto y no
      # como una variable que falta. El valor se carga a mano en el dashboard
      # del servicio, nunca acá — este archivo se commitea. El resto de las
      # variables de IA (modelo, reintentos, topes, límites) tienen default en
      # el código; están documentadas en quodom-web/api/.env.example.
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: quodom-app
    runtime: static
    # Sin `plan`: los static sites de Render no aceptan ese campo, son gratis
    # por definición y declararlo hace fallar el blueprint entero.
    rootDir: quodom-web/app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      # La sesión viaja en una cookie httpOnly. Si la app le hablara al API en
      # otro dominio (quodom-api.onrender.com), Safari descartaría la cookie y
      # nadie con iPhone podría iniciar sesión: onrender.com es un sufijo
      # público, así que cada subdominio cuenta como un sitio distinto. Esta
      # regla hace que el API se vea como parte del mismo sitio. Tiene que ir
      # ANTES del comodín de la SPA.
      - type: rewrite
        source: /api/*
        destination: https://quodom-api.onrender.com/*
      # La app es una SPA: sin esto, entrar directo a cualquier URL que no sea
      # la raíz devuelve 404 en vez de la aplicación.
      - type: rewrite
        source: /*
        destination: /index.html
