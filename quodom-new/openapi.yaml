openapi: 3.0.3
info:
  title: Quodom 3.0 API
  description: API for the lightweight web version of Quodom.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
paths:
  /auth/signup:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
                - whatsapp
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
                company:
                  type: string
                cuit:
                  type: string
                whatsapp:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid input or email already registered
  /auth/login:
    post:
      summary: Authenticate user and return JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      summary: Get details of the current authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
  /catalog/categories:
    get:
      summary: List category hierarchy
      responses:
        '200':
          description: List of categories with nesting
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /catalog/products:
    get:
      summary: Search products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of products matching the criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /quodoms:
    get:
      summary: List Quodoms of the current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of Quodoms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quodom'
        '401':
          description: Unauthorized
    post:
      summary: Create a new Quodom
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - items
              properties:
                title:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: integer
                      quantity:
                        type: number
      responses:
        '201':
          description: Quodom created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quodom'
        '401':
          description: Unauthorized
  /quodoms/{id}:
    get:
      summary: Get details of a Quodom
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Quodom details with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuodomWithItems'
        '401':
          description: Unauthorized
        '404':
          description: Quodom not found
    put:
      summary: Update Quodom title or items
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: integer
                      quantity:
                        type: number
      responses:
        '200':
          description: Quodom updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuodomWithItems'
        '401':
          description: Unauthorized
        '404':
          description: Quodom not found
    delete:
      summary: Delete a Quodom
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Quodom deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Quodom not found
  /quodoms/{id}/send:
    post:
      summary: Mark Quodom status as Sent
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Quodom marked as sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quodom'
        '401':
          description: Unauthorized
        '404':
          description: Quodom not found
  /ai/generate:
    post:
      summary: Generate a Quodom using AI prompt matching the catalog
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
              properties:
                prompt:
                  type: string
      responses:
        '201':
          description: Quodom generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuodomWithItems'
        '401':
          description: Unauthorized
        '500':
          description: AI generation failed or could not parse result
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        company:
          type: string
          nullable: true
        cuit:
          type: string
          nullable: true
        whatsapp:
          type: string
        address:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        parentId:
          type: integer
        image:
          type: string
          nullable: true
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        unit:
          type: string
        image:
          type: string
          nullable: true
        categoryId:
          type: integer
    Quodom:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [En Proceso, Enviado]
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QuodomItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quodomId:
          type: string
          format: uuid
        productId:
          type: integer
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: number
    QuodomWithItems:
      allOf:
        - $ref: '#/components/schemas/Quodom'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/QuodomItem'
